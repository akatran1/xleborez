<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 508 164" width="508" height="164">
  <defs>
    <style>
      .logo-text-company { font-family: 'Russo One', 'Helvetica Neue', Arial, sans-serif; font-size: 58px; font-weight: 700; fill: #131212; }
      .logo-text-tagline { font-family: 'Russo One', 'Helvetica Neue', Arial, sans-serif; font-size: 16px; font-weight: 400; fill: #131212; letter-spacing: 3px; }
      .logo-accent { fill: #fbb710; }
    </style>
  </defs>

  <!-- Background (transparent) -->
  <rect width="508" height="164" fill="none"/>

  <!-- Decorative gold bar above text -->
  <rect x="15" y="10" width="8" height="45" rx="2" class="logo-accent"/>

  <!-- Company name: ФИТФУД -->
  <text x="35" y="52" class="logo-text-company">ФИТФУД</text>

  <!-- Tagline: НОЖИ ДЛЯ ХЛЕБОРЕЗОК -->
  <text x="35" y="78" class="logo-text-tagline">НОЖИ ДЛЯ ХЛЕБОРЕЗОК</text>

  <!-- Gold underline accent -->
  <rect x="15" y="90" width="478" height="3" rx="1" class="logo-accent" opacity="0.7"/>

  <!-- Decorative element: 3 gold dots -->
  <circle cx="35" cy="110" r="4" class="logo-accent"/>
  <circle cx="50" cy="110" r="4" class="logo-accent"/>
  <circle cx="65" cy="110" r="4" class="logo-accent"/>

  <!-- Bottom info text in gold -->
  <text x="35" y="142" font-family="Arial, sans-serif" font-size="20" font-weight="600" fill="#fbb710">
    ООО Фитфуд
  </text>
  <text x="35" y="158" font-family="Arial, sans-serif" font-size="11" fill="#666">
    Ножи для хлеборезок оптом и в розницу
  </text>

  <!-- Right side decorative element -->
  <circle cx="460" cy="80" r="3" class="logo-accent" opacity="0.5"/>
  <circle cx="478" cy="80" r="5" class="logo-accent" opacity="0.3"/>
  <circle cx="496" cy="80" r="7" class="logo-accent" opacity="0.15"/>
</svg>